<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Welfare Organization — 404 Page Not Found</title>

    <!-- AOS Animation CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           SOCIAL WELFARE ORGANIZATION — 404 PAGE
           Matches navbar/footer palette:
           Primary  (trust)  : #1D5B79  deep teal-blue
           Accent   (warmth) : #E07A2F  warm amber
           Secondary(hope)   : #7BA88C  soft sage
           Background        : #FBF8F4  warm off-white
           Text              : #1C2A38  deep navy-charcoal
           ========================================================= */
        :root {
            --sw-primary:   #1D5B79;
            --sw-primary-d: #14455C;
            --sw-accent:    #E07A2F;
            --sw-accent-d:  #C4631C;
            --sw-sage:      #7BA88C;
            --sw-bg:        #FBF8F4;
            --sw-text:      #1C2A38;
            --sw-text-soft: #4A5560;
            --sw-border:    rgba(29, 91, 121, 0.15);
            --sw-border-hi: rgba(29, 91, 121, 0.28);
            --sw-shadow:    rgba(28, 42, 56, 0.08);
            --sw-shadow-hi: rgba(28, 42, 56, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* ===== FULL PAGE LAYOUT ===== */
        body {
            background: var(--sw-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header-placeholder {
            width: 100%;
            flex-shrink: 0;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        #footer-placeholder {
            width: 100%;
            flex-shrink: 0;
            margin-top: auto;
        }

        /* ===== ERROR CARD ===== */
        .error-page {
            max-width: 1100px;
            width: 100%;
            background: #FFFFFF;
            padding: 3rem 3rem;
            display: flex;
            align-items: center;
            gap: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 40px var(--sw-shadow);
            border: 1px solid var(--sw-border);
        }

        /* ===== LEFT COLUMN ===== */
        .error-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .error-number {
            font-size: 8rem;
            font-weight: 800;
            letter-spacing: -6px;
            line-height: 1;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, var(--sw-primary) 0%, var(--sw-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-heading {
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--sw-text);
            margin-bottom: 0.8rem;
        }

        .error-heading i {
            color: var(--sw-accent);
            margin-right: 10px;
            -webkit-text-fill-color: var(--sw-accent);
        }

        .error-description {
            font-size: 1.05rem;
            line-height: 1.8;
            max-width: 440px;
            color: var(--sw-text-soft);
            margin-bottom: 2rem;
        }

        .error-description strong {
            color: var(--sw-accent);
            font-weight: 600;
        }

        .button-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.35s ease;
            font-family: inherit;
            border: none;
            min-width: 150px;
        }

        /* Primary — solid amber CTA (matches Sign Up button) */
        .btn-primary {
            background: var(--sw-accent);
            color: #FFFFFF;
            box-shadow: 0 6px 18px rgba(224, 122, 47, 0.35);
            border: 2px solid var(--sw-accent);
        }

        .btn-primary:hover {
            background: var(--sw-accent-d);
            border-color: var(--sw-accent-d);
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(196, 99, 28, 0.45);
        }

        .btn-primary i {
            color: #FFFFFF;
        }

        /* Secondary — outlined teal */
        .btn-secondary {
            background: transparent;
            color: var(--sw-primary);
            border: 2px solid var(--sw-primary);
        }

        .btn-secondary:hover {
            background: rgba(29, 91, 121, 0.08);
            color: var(--sw-primary-d);
            border-color: var(--sw-primary-d);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(29, 91, 121, 0.15);
        }

        .btn-secondary:hover i {
            color: var(--sw-primary-d);
        }

        .btn i {
            font-size: 0.9rem;
        }

        /* ===== RIGHT COLUMN — ILLUSTRATION ===== */
        .error-illustration {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 280px;
        }

        .error-illustration img {
            width: 100%;
            max-width: 480px;
            height: auto;
            display: block;
        }

        .error-svg-fallback {
            width: 100%;
            max-width: 480px;
            height: auto;
        }

        .error-svg-fallback svg {
            width: 100%;
            height: auto;
        }

        /* ============================================================ */
        /*  RESPONSIVE — TABLET                                         */
        /* ============================================================ */
        @media (max-width: 992px) {
            .error-number {
                font-size: 6rem;
            }

            .error-heading {
                font-size: 2rem;
            }

            .error-illustration img {
                max-width: 380px;
            }

            .error-page {
                padding: 2.5rem 2rem;
                gap: 30px;
            }
        }

        /* ============================================================ */
        /*  RESPONSIVE — MOBILE                                         */
        /* ============================================================ */
        @media (max-width: 768px) {
            .main-content {
                padding: 30px 16px;
            }

            .error-page {
                flex-direction: column-reverse;
                padding: 2rem 1.5rem;
                text-align: center;
                gap: 25px;
                border-radius: 18px;
            }

            .error-content {
                align-items: center;
            }

            .error-description {
                max-width: 340px;
                margin-left: auto;
                margin-right: auto;
            }

            .button-row {
                justify-content: center;
            }

            .error-number {
                font-size: 5rem;
                letter-spacing: -4px;
            }

            .error-heading {
                font-size: 1.8rem;
            }

            .error-description {
                font-size: 0.95rem;
            }

            .error-illustration {
                min-height: 180px;
                width: 100%;
            }

            .error-illustration img {
                max-width: 320px;
            }

            .btn {
                font-size: 0.85rem;
                padding: 0.7rem 1.6rem;
                min-width: 130px;
            }
        }

        /* ============================================================ */
        /*  RESPONSIVE — SMALL MOBILE                                   */
        /* ============================================================ */
        @media (max-width: 480px) {
            .main-content {
                padding: 20px 12px;
            }

            .error-page {
                padding: 1.5rem 1rem;
                gap: 18px;
                border-radius: 14px;
            }

            .error-number {
                font-size: 4rem;
                letter-spacing: -3px;
            }

            .error-heading {
                font-size: 1.4rem;
            }

            .error-description {
                font-size: 0.85rem;
                max-width: 280px;
                margin-bottom: 1.5rem;
            }

            .button-row {
                flex-direction: column;
                align-items: center;
                width: 100%;
                gap: 10px;
            }

            .btn {
                font-size: 0.8rem;
                padding: 0.65rem 1.2rem;
                min-width: 100%;
                width: 100%;
                justify-content: center;
            }

            .error-illustration img {
                max-width: 240px;
            }

            .error-illustration {
                min-height: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER PLACEHOLDER ===== -->
    <div id="header-placeholder"></div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">
        <div class="error-page" data-aos="zoom-in" data-aos-duration="800">

            <!-- ===== LEFT COLUMN ===== -->
            <div class="error-content">
                <div class="error-number" data-aos="fade-right" data-aos-delay="200" data-aos-duration="700">404</div>
                <h1 class="error-heading" data-aos="fade-right" data-aos-delay="350" data-aos-duration="700">
                    <i class="fas fa-hand-holding-heart"></i> Page Not Found
                </h1>
                <p class="error-description" data-aos="fade-right" data-aos-delay="500" data-aos-duration="700">
                    The page you're looking for might have been moved, removed, or never existed.
                    Let's get you back to <strong>Helping Hands</strong> — where every contribution
                    brings hope and change to those who need it most.
                </p>
                <div class="button-row" data-aos="fade-up" data-aos-delay="650" data-aos-duration="700">
                    <a href="index.html" class="btn btn-primary" id="goHomeBtn">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                    <a href="#" class="btn btn-secondary" id="goBackBtn">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            </div>

            <!-- ===== RIGHT COLUMN ===== -->
            <div class="error-illustration" data-aos="fade-left" data-aos-delay="300" data-aos-duration="900">
                <img src="swo10.webp" alt="404 illustration - page not found"
                     onerror="this.style.display='none'; document.getElementById('svgFallback').style.display='block';" />

                <div id="svgFallback" class="error-svg-fallback" style="display:none;">
                    <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Background -->
                        <rect width="400" height="300" rx="16" fill="#FBF8F4"/>

                        <!-- Soft sage circle behind the 404 -->
                        <circle cx="200" cy="140" r="95" fill="#7BA88C" opacity="0.12"/>
                        <circle cx="200" cy="140" r="70" fill="#FFFFFF" stroke="#7BA88C" stroke-width="1.5" opacity="0.6"/>

                        <!-- Amber heart accent -->
                        <path d="M200 95 C 190 85, 175 85, 175 100 C 175 115, 200 130, 200 130 C 200 130, 225 115, 225 100 C 225 85, 210 85, 200 95 Z"
                              fill="#E07A2F" opacity="0.9"/>

                        <!-- Big 404 text -->
                        <text x="200" y="175" text-anchor="middle"
                              font-family="Inter, sans-serif" font-size="58" font-weight="800"
                              fill="#1D5B79">404</text>

                        <!-- Small label -->
                        <text x="200" y="200" text-anchor="middle"
                              font-family="Inter, sans-serif" font-size="11" font-weight="600"
                              fill="#4A5560" letter-spacing="1.5">HELPING HANDS</text>

                        <!-- Decorative dots (teal + amber + sage) -->
                        <circle cx="55" cy="55" r="4" fill="#1D5B79" opacity="0.25"/>
                        <circle cx="345" cy="55" r="4" fill="#E07A2F" opacity="0.3"/>
                        <circle cx="55" cy="245" r="4" fill="#7BA88C" opacity="0.35"/>
                        <circle cx="345" cy="245" r="4" fill="#1D5B79" opacity="0.25"/>

                        <!-- Decorative lines -->
                        <line x1="40" y1="90" x2="90" y2="90" stroke="#7BA88C" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
                        <line x1="310" y1="90" x2="360" y2="90" stroke="#E07A2F" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
                        <line x1="50" y1="210" x2="95" y2="210" stroke="#1D5B79" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
                        <line x1="305" y1="210" x2="350" y2="210" stroke="#7BA88C" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>

                        <!-- Small helping hands icons (simplified) -->
                        <g opacity="0.55">
                            <circle cx="100" cy="250" r="6" fill="#7BA88C"/>
                            <path d="M94 256 Q100 262 106 256" stroke="#7BA88C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        </g>
                        <g opacity="0.55">
                            <circle cx="300" cy="250" r="6" fill="#E07A2F"/>
                            <path d="M294 256 Q300 262 306 256" stroke="#E07A2F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        </g>
                    </svg>
                </div>
            </div>

        </div>
    </div>

    <!-- ===== FOOTER PLACEHOLDER ===== -->
    <div id="footer-placeholder"></div>

    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true,
            offset: 60,
            delay: 0
        });

        document.addEventListener('DOMContentLoaded', function() {
            fetch('header.html')
                .then(response => {
                    if (!response.ok) throw new Error('Header not found');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                    initHeader();
                })
                .catch(error => {
                    console.error('Error loading header:', error);
                    document.getElementById('header-placeholder').innerHTML =
                        '<div style="background:#FBF8F4; color:#1C2A38; padding:16px 20px; text-align:center; font-weight:500; border-bottom:1px solid rgba(29,91,121,0.15);">⚠️ Header failed to load</div>';
                });

            fetch('footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Footer not found');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                    initFooter();
                })
                .catch(error => {
                    console.error('Error loading footer:', error);
                    document.getElementById('footer-placeholder').innerHTML =
                        '<div style="background:#FBF8F4; color:#4A5560; padding:30px 20px; text-align:center; border-top:1px solid rgba(29,91,121,0.15);">⚠️ Footer failed to load</div>';
                });
        });

        function initHeader() {
            const menuBtn = document.getElementById('menuBtn');
            const closeBtn = document.getElementById('closeBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            const mobileOverlay = document.getElementById('mobileOverlay');
            const mobileLinks = mobileMenu ? mobileMenu.querySelectorAll('a') : [];
            const header = document.getElementById('mainHeader');

            if (menuBtn) {
                menuBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (mobileMenu) mobileMenu.classList.add('open');
                    if (mobileOverlay) mobileOverlay.classList.add('open');
                    document.body.style.overflow = 'hidden';
                });
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (mobileMenu) mobileMenu.classList.remove('open');
                    if (mobileOverlay) mobileOverlay.classList.remove('open');
                    document.body.style.overflow = 'auto';
                });
            }

            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (mobileMenu) mobileMenu.classList.remove('open');
                    mobileOverlay.classList.remove('open');
                    document.body.style.overflow = 'auto';
                });
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (mobileMenu) mobileMenu.classList.remove('open');
                    if (mobileOverlay) mobileOverlay.classList.remove('open');
                    document.body.style.overflow = 'auto';
                }
            });

            mobileLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    if (mobileMenu) mobileMenu.classList.remove('open');
                    if (mobileOverlay) mobileOverlay.classList.remove('open');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => {
                        window.location.href = href;
                    }, 200);
                });
            });

            if (header) {
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 20) {
                        header.classList.add('scrolled');
                    } else {
                        header.classList.remove('scrolled');
                    }
                });
            }

            document.querySelectorAll('.desktop-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    document.querySelectorAll('.desktop-nav a').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    window.location.href = href;
                });
            });

            const loginLink = document.querySelector('.login-link');
            if (loginLink) {
                loginLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = this.getAttribute('href');
                });
            }

            const signupBtn = document.querySelector('.signup-btn');
            if (signupBtn) {
                signupBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = this.getAttribute('href');
                });
            }

            const loginMobile = document.querySelector('.login-mobile');
            if (loginMobile) {
                loginMobile.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (mobileMenu) mobileMenu.classList.remove('open');
                    if (mobileOverlay) mobileOverlay.classList.remove('open');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => {
                        window.location.href = this.getAttribute('href');
                    }, 200);
                });
            }

            const signupMobile = document.querySelector('.signup-mobile');
            if (signupMobile) {
                signupMobile.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (mobileMenu) mobileMenu.classList.remove('open');
                    if (mobileOverlay) mobileOverlay.classList.remove('open');
                    document.body.style.overflow = 'auto';
                    setTimeout(() => {
                        window.location.href = this.getAttribute('href');
                    }, 200);
                });
            }

            console.log('✅ Header initialized for 404 page');
        }

        function initFooter() {
            const footerHamburger = document.getElementById('mobileHamburger');
            const footerNavMenu = document.getElementById('mobileNavMenu');

            if (footerHamburger && footerNavMenu) {
                footerHamburger.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    footerNavMenu.classList.toggle('open');
                });
            }

            document.querySelectorAll('.footer-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    window.location.href = href;
                });
            });

            document.querySelectorAll('.mobile-nav-menu a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    if (footerNavMenu) footerNavMenu.classList.remove('open');
                    window.location.href = href;
                });
            });

            document.querySelectorAll('.footer-social a, .mobile-social a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const href = this.getAttribute('href');
                    window.location.href = href;
                });
            });

            console.log('✅ Footer initialized for 404 page');
        }

        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                const mobileMenu = document.getElementById('mobileMenu');
                const mobileOverlay = document.getElementById('mobileOverlay');
                if (mobileMenu) mobileMenu.classList.remove('open');
                if (mobileOverlay) mobileOverlay.classList.remove('open');

                const footerNavMenu = document.getElementById('mobileNavMenu');
                if (footerNavMenu) footerNavMenu.classList.remove('open');

                document.body.style.overflow = 'auto';
            }
        });

        document.getElementById('goHomeBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        document.getElementById('goBackBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.history.back();
        });

        console.log('✅ Social Welfare Organization 404 page ready!');
        console.log('🎨 Palette: teal #1D5B79 · amber #E07A2F · sage #7BA88C · off-white #FBF8F4');
        console.log('✨ AOS animations active');
    </script>

</body>
</html>
